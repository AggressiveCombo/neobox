[package]
name = "neobox-server"
description = "neobox game server: rooms, authoritative input timeline, admin interface"
license = "AGPL-3.0-or-later"
edition.workspace = true
version.workspace = true
repository.workspace = true

[dependencies]
neobox-sim = { path = "../sim" }
neobox-net = { path = "../net" }
neobox-wasm = { path = "../wasm" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }

[target.'cfg(windows)'.dependencies]
nu-ansi-term = "0.50"
