[package]
name = "neobox-store"
description = "neobox persistent store: accounts, sessions, friends, map library and player prefs (SQLite)"
license = "AGPL-3.0-or-later"
edition.workspace = true
version.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.22"
neobox-net = { path = "../net" }
neobox-sim = { path = "../sim" }
rand = "0.9"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.154"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
