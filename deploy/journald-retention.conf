# Keep server logs (which include player IP addresses) for 14 days, as the privacy notice says.
# Install: copy to /etc/systemd/journald.conf.d/neobox-retention.conf, then `systemctl restart systemd-journald`
# and `journalctl --vacuum-time=14d` to drop older entries now.
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
